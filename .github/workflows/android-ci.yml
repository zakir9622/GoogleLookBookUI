name: Android CI

# PR checks + main push checks. Does NOT publish GitHub Releases —
# see release-apk.yml (main merges / pushes only).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Keep every main push so each successful merge can publish its own APK;
  # cancel superseded pull-request checks only.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: gradle/actions/setup-gradle@v4

      - name: Ensure debug keystore
        run: |
          set -euo pipefail
          if [[ ! -f debug.keystore ]]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug, O=Android, C=US" \
              >/dev/null 2>&1
          fi
          test -s debug.keystore

      - name: Validate toolchain and Gradle wrapper
        run: |
          set -euo pipefail
          chmod +x ./gradlew scripts/*.sh ml/*.py 2>/dev/null || true
          test -x ./gradlew
          java -version
          ./gradlew --version

      - name: Static Kotlin quality baseline
        run: ./gradlew :app:detekt

      - name: Bootstrap Python ML deps
        run: pip install --upgrade pip && pip install onnxruntime numpy huggingface_hub onnx pillow

      - name: Bootstrap debug lite pack if missing
        run: |
          if [ ! -f app/src/debug/assets/packs/lite-v1/garment_seg.onnx ]; then
            python3 ml/export_lite_pack.py --out app/src/debug/assets/packs/lite-v1
          fi

      - name: Verify lite pack assets
        run: bash scripts/verify-lite-pack.sh

      - name: Verify HF packs manifest
        run: python3 scripts/verify-manifest.py

      - name: Local model integration (bundled assets)
        run: python3 scripts/integration-local-models.py --skip-hf-download

      - name: Edge-case integration harness
        run: python3 scripts/integration-edge-cases.py

      - name: Local model benchmarks (smoke)
        run: python3 scripts/benchmark-local.py

      - name: ATR classify fixture harness (R2)
        run: python3 scripts/test_atr_classify.py

      - name: Unit tests
        run: ./gradlew :shared:testDebugUnitTest :app:testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload Spatial UI visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: spatial-ui-visual-evidence
          path: |
            build/screenshots/**/*.png
            app/build/screenshots/**/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Kotlin static-quality evidence
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-static-quality
          path: app/build/reports/detekt/**
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: vestra-ci-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-benchmark-json
          path: |
            /tmp/lookbook-benchmark-local.json
            /tmp/lookbook-benchmark-cloud.json
          retention-days: 7
          if-no-files-found: ignore

  publish-debug-release:
    name: Publish debug APK release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: vestra-ci-debug-apk
          path: dist

      - name: Package APK and checksum
        id: package
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find dist -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          TAG="debug-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"
          APK_NAME="GoogleLookBookUI-${TAG}.apk"
          mv "$APK" "dist/$APK_NAME"
          sha256sum "dist/$APK_NAME" | tee "dist/$APK_NAME.sha256"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "GoogleLookBookUI Debug $TAG" \
            --prerelease \
            --notes "Debug APK built from successful main commit $GITHUB_SHA. This build uses the CI debug signing key; uninstall a previous build before installing it." \
            dist/*.apk dist/*.sha256
