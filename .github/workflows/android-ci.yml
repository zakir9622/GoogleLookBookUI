name: Android CI

# PR checks + main push checks. Does NOT publish GitHub Releases —
# see release-apk.yml (main merges / pushes only).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Bootstrap Python ML deps
        run: pip install onnxruntime numpy huggingface_hub onnx

      - name: Bootstrap debug lite pack if missing
        run: |
          if [ ! -f composeApp/src/debug/assets/packs/lite-v1/garment_seg.onnx ]; then
            python3 ml/export_lite_pack.py --out composeApp/src/debug/assets/packs/lite-v1
          fi

      - name: Verify lite pack assets
        run: bash scripts/verify-lite-pack.sh

      - name: Verify HF packs manifest
        run: python3 scripts/verify-manifest.py

      - name: Local model integration (bundled assets)
        run: python3 scripts/integration-local-models.py --skip-hf-download

      - name: Edge-case integration harness
        run: python3 scripts/integration-edge-cases.py

      - name: Local model benchmarks (smoke)
        run: python3 scripts/benchmark-local.py

      - name: ATR classify fixture harness (R2)
        run: python3 scripts/test_atr_classify.py

      - name: Unit tests
        run: ./gradlew :shared:testDebugUnitTest :composeApp:testSideloadDebugUnitTest

      - name: Lint
        run: ./gradlew :composeApp:lintSideloadDebug

      - name: Assemble sideload debug APK
        run: ./gradlew :composeApp:assembleSideloadDebug

      - uses: actions/upload-artifact@v4
        with:
          name: vestra-debug-apk
          path: composeApp/build/outputs/apk/sideload/debug/*.apk
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-benchmark-json
          path: |
            /tmp/lookbook-benchmark-local.json
            /tmp/lookbook-benchmark-cloud.json
          retention-days: 7
          if-no-files-found: ignore
