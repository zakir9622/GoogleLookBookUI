name: Release APK

# Releases are immutable versioned GitHub Releases created from vX.Y.Z tags.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate toolchain and Gradle wrapper
        run: |
          set -euo pipefail
          test -x ./gradlew
          java -version
          ./gradlew --version

      - name: Prepare release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/lookbook-sideload.keystore"

          if [[ "${GITHUB_REF_NAME}" == *-test.* || "${GITHUB_REF_NAME}" == *-test-* ]]; then
            # Disposable prerelease key: test builds intentionally require uninstall/reinstall.
            TEST_PASSWORD="$(openssl rand -hex 24)"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -storepass "$TEST_PASSWORD" \
              -keypass "$TEST_PASSWORD" \
              -alias lookbook \
              -keyalg RSA -keysize 2048 -validity 3650 \
              -dname "CN=GoogleLookBookUI Test, OU=QA, O=GoogleLookBookUI, C=US" \
              >/dev/null 2>&1
            {
              echo "KEYSTORE_PATH=$KEYSTORE_PATH"
              echo "KEYSTORE_PASSWORD=$TEST_PASSWORD"
              echo "KEY_ALIAS=lookbook"
              echo "KEY_PASSWORD=$TEST_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            test -n "$KEYSTORE_BASE64" || { echo "Missing KEYSTORE_BASE64 repository secret for stable release" >&2; exit 1; }
            test -n "$KEYSTORE_PASSWORD_SECRET" || { echo "Missing KEYSTORE_PASSWORD repository secret for stable release" >&2; exit 1; }
            test -n "$KEY_ALIAS_SECRET" || { echo "Missing KEY_ALIAS repository secret for stable release" >&2; exit 1; }
            test -n "$KEY_PASSWORD_SECRET" || { echo "Missing KEY_PASSWORD repository secret for stable release" >&2; exit 1; }
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            chmod 600 "$KEYSTORE_PATH"
            {
              echo "KEYSTORE_PATH=$KEYSTORE_PATH"
              echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD_SECRET"
              echo "KEY_ALIAS=$KEY_ALIAS_SECRET"
              echo "KEY_PASSWORD=$KEY_PASSWORD_SECRET"
            } >> "$GITHUB_ENV"
          fi

          test -s "$KEYSTORE_PATH"

      - name: Verify release signing key
        run: |
          set -euo pipefail
          keytool -list -keystore "$KEYSTORE_PATH" \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Assemble signed release APK
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Stage APK and checksum
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t APKS < <(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print)
          test "${#APKS[@]}" -eq 1

          RELEASE_TAG="${GITHUB_REF_NAME}"
          RELEASE_TITLE="GoogleLookBookUI ${RELEASE_TAG}"
          if [[ "${RELEASE_TAG}" == *-* ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi

          APK_NAME="GoogleLookBookUI-${RELEASE_TAG}.apk"
          cp "${APKS[0]}" "dist/${APK_NAME}"
          sha256sum "dist/${APK_NAME}" | tee "dist/${APK_NAME}.sha256"

          {
            echo "tag=${RELEASE_TAG}"
            echo "title=${RELEASE_TITLE}"
            echo "prerelease=${PRERELEASE}"
          } >> "${GITHUB_OUTPUT}"
          ls -lh dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoogleLookBookUI-${{ steps.stage.outputs.tag }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.stage.outputs.tag }}
          RELEASE_TITLE: ${{ steps.stage.outputs.title }}
          PRERELEASE: ${{ steps.stage.outputs.prerelease }}
        run: |
          set -euo pipefail
          NOTES="$(cat <<EOF
          Build from commit ${GITHUB_SHA}.

          Install the APK directly on a compatible Android device. Verify the downloaded APK with the accompanying SHA-256 checksum file.

          Test prereleases use a disposable signing key and require uninstalling any previous build before installation. Stable releases use the preserved signing identity from GitHub Secrets and update in place.
          EOF
          )"
          ARGS=(
            "${RELEASE_TAG}"
            --target "${GITHUB_SHA}"
            --verify-tag
            --title "${RELEASE_TITLE}"
            --notes "${NOTES}"
            dist/*
          )
          if [[ "${PRERELEASE}" == "true" ]]; then
            ARGS+=(--prerelease)
          fi
          gh release create "${ARGS[@]}"
          echo "Published: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
