name: Release APK

# Releases are immutable versioned GitHub Releases created from vX.Y.Z tags.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate toolchain and Gradle wrapper
        run: |
          set -euo pipefail
          test -x ./gradlew
          java -version
          ./gradlew --version

      - name: Verify stable sideload keystore
        run: |
          set -euo pipefail
          test -f signing/lookbook-sideload.keystore
          keytool -list -keystore signing/lookbook-sideload.keystore \
            -storepass lookbook-sideload -alias lookbook

      - name: Assemble signed release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Stage APK and checksum
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t APKS < <(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print)
          test "${#APKS[@]}" -eq 1

          RELEASE_TAG="${GITHUB_REF_NAME}"
          RELEASE_TITLE="GoogleLookBookUI ${RELEASE_TAG}"
          if [[ "${RELEASE_TAG}" == *-* ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi

          APK_NAME="GoogleLookBookUI-${RELEASE_TAG}.apk"
          cp "${APKS[0]}" "dist/${APK_NAME}"
          sha256sum "dist/${APK_NAME}" | tee "dist/${APK_NAME}.sha256"

          {
            echo "tag=${RELEASE_TAG}"
            echo "title=${RELEASE_TITLE}"
            echo "prerelease=${PRERELEASE}"
          } >> "${GITHUB_OUTPUT}"
          ls -lh dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoogleLookBookUI-${{ steps.stage.outputs.tag }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.stage.outputs.tag }}
          RELEASE_TITLE: ${{ steps.stage.outputs.title }}
          PRERELEASE: ${{ steps.stage.outputs.prerelease }}
        run: |
          set -euo pipefail
          NOTES="$(cat <<EOF
          Build from commit ${GITHUB_SHA}.

          Install the APK directly on a compatible Android device. Verify the downloaded APK with the accompanying SHA-256 checksum file.
          EOF
          )"
          ARGS=(
            "${RELEASE_TAG}"
            --target "${GITHUB_SHA}"
            --verify-tag
            --title "${RELEASE_TITLE}"
            --notes "${NOTES}"
            dist/*
          )
          if [[ "${PRERELEASE}" == "true" ]]; then
            ARGS+=(--prerelease)
          fi
          gh release create "${ARGS[@]}"
          echo "Published: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
