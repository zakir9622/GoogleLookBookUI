name: Testing APK

# Builds an installable debug APK with the Lite model pack bundled in, so it
# generates images out of the box for manual testing — no Hugging Face setup and
# no local toolchain required. Run it from the Actions tab (Run workflow), then
# download the `the-lookbook-testing-apk` artifact and sideload it.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the Lite model pack
        run: |
          cd ml
          pip install onnx onnxruntime huggingface_hub numpy pillow
          python export_lite_pack.py

      - name: Bundle the pack into debug assets
        run: |
          mkdir -p composeApp/src/debug/assets/packs/lite-v1
          cp ml/exports/lite-v1/garment_seg.onnx ml/exports/lite-v1/human_parse.onnx \
             composeApp/src/debug/assets/packs/lite-v1/

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew :composeApp:assembleSideloadDebug

      - uses: actions/upload-artifact@v4
        with:
          name: the-lookbook-testing-apk
          path: composeApp/build/outputs/apk/sideload/debug/*.apk
          retention-days: 30
